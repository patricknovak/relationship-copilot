<!-- Subject: Your sign-in link for Relationship Copilot -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your sign-in link for Relationship Copilot</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #fbf8f4;
      color: #221a22;
      font-family: Georgia, 'Times New Roman', serif;
      line-height: 1.55;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #fbf8f4; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 520px;
              background: #ffffff;
              border: 1px solid #e8ddd8;
              border-radius: 16px;
              padding: 32px 28px;
            "
          >
            <tr>
              <td style="font-size: 16px; color: #221a22">
                <p style="margin: 0 0 24px">
                  Tap below to sign in. This link works once and expires
                  shortly.
                </p>
                <p style="margin: 0 0 24px; text-align: center">
                  <a
                    href="{{ .ConfirmationURL }}"
                    style="
                      display: inline-block;
                      background: #74386f;
                      color: #ffffff;
                      text-decoration: none;
                      font-family: system-ui, -apple-system, sans-serif;
                      font-size: 15px;
                      font-weight: 600;
                      padding: 12px 22px;
                      border-radius: 999px;
                    "
                    >Sign in</a
                  >
                </p>
                <p
                  style="
                    margin: 0 0 24px;
                    font-family: system-ui, -apple-system, sans-serif;
                    font-size: 13px;
                    color: #6b5f6a;
                  "
                >
                  Didn't ask for this? Ignore this email and nothing changes.
                </p>
                <p style="margin: 0; font-style: italic">
                  Closer, on purpose. — Relationship Copilot
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
