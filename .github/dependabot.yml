version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # @vinext/cloudflare peers on a matching vinext minor, so separate PRs
      # fail npm ci until both land (#151-#158, #167/#168).
      vinext:
        patterns:
          - "vinext"
          - "@vinext/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
