version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # @vinext/cloudflare peers on a matching vinext minor, so separate PRs
      # fail npm ci until both land (#151-#158, #167/#168).
      vinext:
        patterns:
          - "vinext"
          - "@vinext/*"
    # Hold stripe at 23.1.0 until after launch (Patrick, 2026-11-24). Each
    # stripe minor expects a newer STRIPE_API_VERSION (web/lib/stripe.ts), so
    # every bump fails typecheck until the pin moves. Patch releases still
    # come through. Remove this block after launch.
    ignore:
      - dependency-name: "stripe"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
