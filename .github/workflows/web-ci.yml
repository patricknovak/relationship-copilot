name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Node 24 everywhere (CI, the Worker build, local).
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # Cloudflare Workers build (vinext); docs/CLOUDFLARE_MIGRATION.md.
      - name: Build (Cloudflare)
        run: npm run build:vinext
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end (Playwright)
        run: npm run test:e2e
        env:
          CI: true
          # next start reads public values from .env.production (committed).
          # No Resend / Stripe live calls: tests only hit unsigned pages and
          # negative API paths. Rel activation drip stays NO SEND.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  e2e-core:
    # Signed-in core loop (invite, join, private answers, reveal) against a
    # local Supabase stack with every migration applied. Local demo keys
    # only; never touches production.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Start local Supabase
        run: ./scripts/e2e-core-stack.sh "$RUNNER_TEMP/e2e-core.env" && cat "$RUNNER_TEMP/e2e-core.env" >> "$GITHUB_ENV"
      - name: Build against the local stack
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Core loop (Playwright)
        run: npm run test:e2e:core
        env:
          CI: true
      - name: Upload core-loop report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-core-report
          path: web/test-results
          retention-days: 7

  deploy-cloudflare:
    # Production deploy to the Cloudflare Worker "relationship-copilot".
    # Only after every test job passes on the same commit: a red main must
    # never reach the live site.
    needs: [web, database, e2e-core]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # No concurrency group here on purpose. GitHub keeps at most one pending
    # job per group and cancels the older pending one when another arrives,
    # so three merges in a row cancelled the deploy of the newest commit
    # (2026-10-18, run 39149333763) while the two older runs skipped via the
    # tip check below. Without a group every run reaches the tip check, and
    # only the run whose commit is still the tip of main deploys; an older
    # run cannot finish after a newer one because a newer run needs minutes
    # of CI before it can deploy at all.
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # NEXT_PUBLIC_* values are public and inlined at build time from
      # web/.env.production. Do not set them here: an unset repo variable
      # arrives as an empty env var and would override the file. Server
      # secrets live in the Worker (wrangler secret put) and persist across
      # deploys.
      - name: Build (Cloudflare)
        run: npm run build:vinext
      - name: Deploy only the current tip of main
        run: |
          tip="$(git ls-remote --quiet origin refs/heads/main | cut -f1)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved to $tip while this run was queued; a newer run deploys it. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        id: tip
      - name: Check Cloudflare credentials
        if: steps.tip.outputs.skip != 'true'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets; nothing was deployed."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Workers
        if: steps.tip.outputs.skip != 'true'
        run: npx wrangler deploy --config dist/server/wrangler.json --var GIT_COMMIT_SHA:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v6
      - name: Migrations + RLS tests
        run: ./supabase/tests/run.sh
